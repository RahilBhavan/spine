name: refresh
on:
  schedule:
    - cron: '17 * * * *'   # hourly
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install numpy
      - name: restore the latest generated data from the data branch (first run falls back to main's snapshot)
        run: git fetch -q --depth 1 origin data && git checkout FETCH_HEAD -- data || echo "no data branch yet; starting from main's snapshot"
      - name: fetch live data (positions, liquidations, tags, depth, vaults) and summarize
        run: |
          python -m spine.fetch_positions
          python -m spine.fetch_liquidations
          python -m spine.tag_coinbase
          python -m spine.fetch_depth
          python -m spine.fetch_vaults
          python -m spine.summarize
          python -m spine.history
          python -m spine.render_writeup
      - name: alert (one open issue while any market's distance to capacity is 10% or less)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m spine.alert > alert.txt
          [ -s alert.txt ] || exit 0
          title="Alert: liquidatable borrow within 10% of modeled capacity"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          [ -n "$n" ] || gh issue create --title "$title" --body-file alert.txt
      - name: backtest (incremental; a model failure leaves a warning and a stale Backtest tab, not a dead dashboard)
        continue-on-error: true
        run: python -m spine.backtest --max-seconds 600
      - name: publish snapshot (data branch is one orphan commit, force-pushed each run, so main gets only human commits)
        run: |
          git config user.name spine-bot
          git config user.email spine-bot@users.noreply.github.com
          git checkout -q --orphan data
          git rm -rqf --cached .
          git add data/liquidations_*.json data/coinbase_wallets.json data/depth.json data/vaults.json data/summary.json data/history.csv data/calibration.json data/backtest.json
          git add index.html site/ docs/social-card.png
          git commit -qm "data: snapshot $(date -u +%FT%H:%MZ)"
          git push -qf origin data
      - name: stage site
        run: |
          mkdir -p _site/site _site/data
          cp site/* _site/site/ && cp data/summary.json data/history.csv _site/data/
          cp data/backtest.json data/calibration.json data/vaults.json _site/data/ 2>/dev/null || true
          cp PLAN.md WRITEUP.md _site/
          cp index.html docs/social-card.png _site/   # root redirect with link-preview tags; og:image points at /spine/social-card.png
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
