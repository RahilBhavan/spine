name: refresh
on:
  schedule:
    - cron: '17 * * * *'   # hourly
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy
      - name: fetch live data (positions, liquidations, tags, depth)
        run: |
          python -m spine.fetch_positions
          python -m spine.fetch_liquidations
          python -m spine.tag_coinbase
          python -m spine.fetch_depth
          python -m spine.summarize
          python -m spine.history
          python -m spine.render_writeup
          python -m spine.backtest --max-seconds 600
      - name: commit snapshot
        run: |
          git config user.name spine-bot
          git config user.email spine-bot@users.noreply.github.com
          git add data/positions_*.json data/liquidations_*.json data/coinbase_wallets.json data/depth.json data/summary.json data/history.csv site/writeup.html data/backtest.json
          git diff --cached --quiet || git commit -qm "data: hourly snapshot $(date -u +%FT%H:%MZ)"
          git push
      - name: stage site
        run: |
          mkdir -p _site/site _site/data
          cp site/* _site/site/ && cp data/summary.json _site/data/
          cp data/backtest.json data/calibration.json _site/data/ 2>/dev/null || true
          cp PLAN.md WRITEUP.md _site/
          printf '<meta http-equiv="refresh" content="0; url=site/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
