name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --extra dev
      - run: uv run --locked python -m pytest -q tests
